name: Build and publish MIXO6 (Windows x64)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore .\src\MIXO6\MIXO6.csproj -r win-x64

      - name: Publish self-contained Windows x64
        run: dotnet publish .\src\MIXO6\MIXO6.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o .\artifacts\MIXO6-win-x64

      - name: Package release ZIP
        shell: pwsh
        run: Compress-Archive -Path .\artifacts\MIXO6-win-x64\* -DestinationPath .\artifacts\MIXO6-win-x64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MIXO6-win-x64
          path: artifacts/MIXO6-win-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release for version tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/MIXO6-win-x64.zip
