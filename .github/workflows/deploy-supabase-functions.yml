name: Deploy MIXO6 Supabase Edge Function

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'supabase/functions/mixo6-login/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase-functions.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mixo6-supabase-functions-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy mixo6-login
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: tgltkobvufqazjrjckpe

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify required configuration
        shell: bash
        run: |
          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            echo "::error::Missing GitHub Actions secret SUPABASE_ACCESS_TOKEN. Add a Supabase Personal Access Token in Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [[ ! -f "supabase/functions/mixo6-login/index.ts" ]]; then
            echo "::error::Missing supabase/functions/mixo6-login/index.ts in repository root."
            exit 1
          fi

      - name: Deploy Edge Function
        shell: bash
        run: |
          supabase functions deploy mixo6-login \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --use-api
