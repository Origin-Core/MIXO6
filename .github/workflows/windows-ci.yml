name: Validate MIXO6 Windows build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Download pinned PresentMon FPS capture tool
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $toolDir = '.\src\MIXO6\tools'
          New-Item -ItemType Directory -Force -Path $toolDir | Out-Null
          $toolPath = Join-Path $toolDir 'PresentMon.exe'
          $url = 'https://github.com/GameTechDev/PresentMon/releases/download/v2.6.0/PresentMon-2.6.0-x64.exe'
          Invoke-WebRequest -Uri $url -OutFile $toolPath
          $file = Get-Item $toolPath
          if ($file.Length -lt 100000) { throw 'PresentMon download is incomplete or invalid.' }
          Write-Host ("PresentMon 2.6.0 downloaded; size={0}; SHA256={1}" -f $file.Length, (Get-FileHash $toolPath -Algorithm SHA256).Hash)
      - name: Restore
        run: dotnet restore .\src\MIXO6\MIXO6.csproj -r win-x64
      - name: Build Release x64
        run: dotnet build .\src\MIXO6\MIXO6.csproj -c Release -r win-x64 --no-restore
      - name: Publish self-contained executable
        run: dotnet publish .\src\MIXO6\MIXO6.csproj -c Release -r win-x64 --no-restore --self-contained true -p:PublishSingleFile=true -o .\artifacts\MIXO6-win-x64
      - uses: actions/upload-artifact@v7
        with:
          name: MIXO6-win-x64
          path: artifacts/MIXO6-win-x64
          if-no-files-found: error
          retention-days: 14
