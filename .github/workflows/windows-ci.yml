name: Validate MIXO6 Windows build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mixo6-windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Download and verify PresentMon
        shell: pwsh
        run: .\scripts\Download-PresentMon.ps1
      - name: Restore
        run: dotnet restore .\src\MIXO6\MIXO6.csproj -r win-x64
      - name: Build Release x64
        run: dotnet build .\src\MIXO6\MIXO6.csproj -c Release -r win-x64 --no-restore
      - name: Publish self-contained executable
        run: dotnet publish .\src\MIXO6\MIXO6.csproj -c Release -r win-x64 --no-restore --self-contained true -p:PublishSingleFile=true -o .\artifacts\MIXO6-win-x64
      - name: Verify release contents
        shell: pwsh
        run: |
          $required = @('.\artifacts\MIXO6-win-x64\MIXO6.exe', '.\artifacts\MIXO6-win-x64\tools\PresentMon.exe', '.\artifacts\MIXO6-win-x64\tools\PresentMon-LICENSE.txt')
          foreach ($path in $required) { if (-not (Test-Path $path)) { throw "Required release file missing: $path" } }
      - uses: actions/upload-artifact@v7
        with:
          name: MIXO6-win-x64
          path: artifacts/MIXO6-win-x64
          if-no-files-found: error
          retention-days: 14
